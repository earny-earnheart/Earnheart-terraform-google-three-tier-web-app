$schema: https://api.gitbook.com/gitbook-docs.yaml
site:
  title: Pantheon-Platform Docs
  structure:
    - type: section
      key: section-1
      title: Home
      path: home
      icon: house
      default: true
      children:
        - type: space
          key: space-1
          title: Home
          path: home
          default: true
          content:
            directory: ./home
    - type: section
      key: section-2
      title: Documentation
      path: documentation
      icon: book-blank
      children:
        - type: space
          key: space-2
          title: Documentation
          path: documentation
          default: true
          content:
            directory: ./documentation
    - type: section
      key: section-3
      title: API Reference
      path: api-reference
      icon: terminal
      children:
        - type: space
          key: space-3
          title: API Reference
          path: api-reference
          default: true
          content:
            directory: ./api-reference
    - type: section
      key: section-4
      title: Changelog
      path: changelog
      icon: clock-rotate-left
      children:
        - type: space
          key: space-4
          title: Changelog
          path: changelog
          default: true
          content:
            directory: ./changelog
    - type: section
      key: section-5
      title: Help Center
      path: help-center
      icon: life-ring
      children:
        - type: space
          key: space-5
          title: Help Center
          path: help-center
          default: true
          content:
            directory: ./help-center
    - type: section
      key: section-6
      title: Platform
      path: platform
      icon: sitemap
      children:
        - type: space
          key: space-6
          title: Platform
          path: platform
          default: true
          content:
            directory: ./platform
    - type: section
      key: section-7
      title: Operations
      path: operations
      icon: gauge-high
      children:
        - type: space
          key: space-7
          title: Operations
          path: operations
          default: true
          content:
            directory: ./operations
    - type: section
      key: section-8
      title: Governance
      path: governance
      icon: shield-halved
      children:
        - type: space
          key: space-8
          title: Governance
          path: governance
          default: true
          content:
            directory: ./governance
